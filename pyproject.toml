[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watari-cli"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
watari = "watari_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watari_cli = ["skill/*.md"]
